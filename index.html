body::before{content:"OSIS";position:fixed;right:-4vw;bottom:-9vw;font:800 36vw/1 var(--disp);color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.12);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:28px 20px 56px}
.brand{display:inline-flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);padding:8px 18px 8px 14px;border-radius:999px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:800 1rem/1.1 var(--disp)}
.brand .bt{border-left:2px solid var(--line);padding-left:12px;margin-left:2px}
.brand .bt small{display:block;font:500 .78rem var(--body);color:var(--muted);margin-top:3px}
.lg{flex:none;height:44px;background:center/contain no-repeat}
.lg.s{width:44px;background-image:var(--l1)}.lg.o{width:37px;background-image:var(--l2)}
@media(max-width:480px){.lg{height:36px}.lg.s{width:36px}.lg.o{width:30px}.brand{padding:7px 14px 7px 10px;font-size:.92rem}.brand .bt small{font-size:.72rem}}
h1{font:800 clamp(2.6rem,9vw,5.2rem)/.95 var(--disp);letter-spacing:-.03em;margin:9vh 0 14px;max-width:11ch}
.lead{max-width:44ch;opacity:.9;margin:0 0 28px}
.card{background:var(--paper);color:var(--ink);border-radius:28px 28px 28px 6px;padding:26px;max-width:440px;transform:rotate(-1.2deg);box-shadow:10px 10px 0 var(--ink)}
label{display:block;font:700 .9rem var(--body);margin:0 0 6px}
input{width:100%;font:500 1.05rem var(--body);padding:13px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:16px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:7px;background:none;border:0;color:var(--blue);font:700 .85rem var(--body);padding:6px 8px;cursor:pointer}
.btn{display:inline-block;width:100%;text-align:center;text-decoration:none;font:800 1.05rem var(--disp);background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.65;cursor:wait}
.err{min-height:1.4em;margin:12px 0 0;color:#b3002d;font-weight:700;font-size:.92rem}
.hint{font-size:.85rem;color:var(--muted);margin:14px 0 0}
#res{display:none}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.out{background:none;border:2px solid var(--paper);color:var(--paper);border-radius:999px;font:700 .85rem var(--body);padding:7px 16px;cursor:pointer}
.hero{position:relative;margin-top:5vh}
.hi{font:500 1.15rem var(--body);margin:0}
.nm{font:800 clamp(1.5rem,4.6vw,2.3rem)/1.1 var(--disp);margin:2px 0 0;letter-spacing:-.01em}
.kls{margin:6px 0 0;opacity:.85}
.big{font:800 clamp(5rem,27vw,15.5rem)/.85 var(--disp);color:var(--sun);letter-spacing:-.05em;margin:3vh 0 0;display:flex;text-shadow:0 .05em 0 #b8870a,0 0 .4em rgba(255,210,63,.5)}
.big span{display:inline-block;animation:drop .7s cubic-bezier(.2,1.4,.4,1) both,bob 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*.08s),calc(1s + var(--i)*.15s)}
@keyframes bob{50%{transform:translateY(-.06em) rotate(-1.5deg)}}
.hero .hi,.hero .nm,.hero .kls,.big{position:relative;z-index:1}
.rays{position:absolute;left:50%;top:42%;width:min(160vw,1500px);aspect-ratio:1;background:repeating-conic-gradient(rgba(255,210,63,.26) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:rays 70s linear infinite;pointer-events:none;z-index:0}
@keyframes rays{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.fl{position:absolute;width:var(--s);height:var(--s);pointer-events:none;z-index:0;animation:fl 6s ease-in-out infinite}
.fl.st{background:var(--c);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.fl.ri{border:3px solid var(--c);border-radius:50%}.fl.dt{background:var(--c);border-radius:50%}
.fl.pl{background:linear-gradient(var(--c),var(--c)) center/100% 22% no-repeat,linear-gradient(var(--c),var(--c)) center/22% 100% no-repeat}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(28deg)}}
.mq{width:100vw;margin:5vh 0 0 calc(50% - 50vw);transform:rotate(-2deg);background:var(--sun);color:var(--ink);border-block:2px solid var(--ink);overflow:hidden;white-space:nowrap;box-shadow:0 6px 0 var(--ink)}
.mq div{display:inline-block;padding:11px 0;font:800 1.1rem var(--disp);letter-spacing:.04em;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.sheet,.wa{animation:up .8s cubic-bezier(.2,.8,.2,1) 1.1s both}.wa{animation-delay:1.4s}
@keyframes pu{0%{box-shadow:4px 4px 0 var(--ink),0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:4px 4px 0 var(--ink),0 0 0 18px rgba(255,255,255,0)}}
.wa .btn{animation:pu 2s ease-out infinite}
@media(prefers-reduced-motion:reduce){.rays,.fl,.mq div,.sheet,.wa,.wa .btn{animation:none}}
@keyframes drop{from{transform:translateY(-120%) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.badge{position:absolute;right:0;top:-4px;width:clamp(96px,22vw,150px);animation:spin 24s linear infinite}
.badge text{font:700 11.5px var(--body);fill:var(--blush);letter-spacing:.14em}
@keyframes spin{to{transform:rotate(360deg)}}
.sheet{background:var(--paper);color:var(--ink);border-radius:30px;padding:26px 22px;margin-top:4vh;box-shadow:10px 10px 0 var(--ink)}
.sheet h2{font:800 1.35rem var(--disp);margin:0 0 14px}
.sc{display:grid;grid-template-columns:1.3fr 1fr 1fr;align-items:center}
.sc>div{padding:13px 8px;border-bottom:1px solid var(--line)}
.sc .h{font:700 .85rem var(--body);color:var(--muted);border-bottom:2px solid var(--ink)}
.sc .n{font:800 clamp(1.5rem,5vw,2.2rem)/1 var(--disp);text-align:center}
.sc .n.adj{background:#ece7ff;color:var(--blue-d)}
.sc .h.adj{background:#ece7ff;text-align:center;color:var(--blue-d)}.sc .h.o{text-align:center}
.sc .t{font-weight:700}
.sc .tot{border-bottom:0;background:var(--ink);color:var(--sun)}
.sc .tot.n.adj{background:var(--blue);color:var(--sun)}
.sc .na{font:500 1.4rem var(--disp);opacity:.45}
.note{font-size:.88rem;color:var(--muted);margin:12px 0 0}
.pick{display:grid;gap:12px;margin-top:6px}
@media(min-width:620px){.pick{grid-template-columns:1fr 1fr}}
.pick div{border:2px solid var(--ink);border-radius:16px;padding:14px 16px}
.pick small{display:block;font-weight:700;color:var(--muted);margin-bottom:4px}
.pick b{font:800 1.05rem/1.25 var(--disp)}
.wa{background:var(--wa);color:#fff;border-radius:30px 30px 6px 30px;padding:26px 22px;margin-top:26px;box-shadow:10px 10px 0 var(--ink)}
.wa h2{font:800 1.5rem var(--disp);margin:0 0 6px;color:#fff}
.wa p{margin:0 0 18px;max-width:46ch}
.wa .btn{width:auto;background:#fff;color:var(--ink)}
html.bad,html.bad body{background:#150f3d}
.glt{font:800 clamp(4.2rem,22vw,12rem)/.9 var(--disp);letter-spacing:-.04em;color:#ff5d73;position:relative;display:inline-block;margin:4vh 0 0;animation:jit 3.2s steps(1) infinite}
.glt::before,.glt::after{content:attr(data-t);position:absolute;left:0;top:0;mix-blend-mode:screen}
.glt::before{color:#35e0ff;transform:translate(-4px,0);clip-path:inset(0 0 55% 0);animation:g1 2.4s steps(1) infinite}
.glt::after{color:var(--sun);transform:translate(4px,0);clip-path:inset(55% 0 0 0);animation:g2 2.1s steps(1) infinite}
@keyframes g1{0%,88%{transform:translate(-4px,0)}90%{transform:translate(-14px,3px)}94%{transform:translate(8px,-2px)}100%{transform:translate(-4px,0)}}
@keyframes g2{0%,80%{transform:translate(4px,0)}83%{transform:translate(16px,-3px)}87%{transform:translate(-10px,2px)}100%{transform:translate(4px,0)}}
@keyframes jit{0%,92%,100%{transform:none}94%{transform:skewX(-6deg)}96%{transform:skewX(4deg) translateX(6px)}}
.code{display:inline-block;font:700 .85rem ui-monospace,Menlo,monospace;background:#ff5d73;color:#150f3d;border-radius:6px;padding:3px 10px;margin-top:10px}
.term{background:#0a0726;color:#cfd0ff;border:2px solid #ff5d73;border-radius:20px;padding:22px;margin-top:4vh;font:500 .95rem/1.9 ui-monospace,Menlo,monospace;box-shadow:10px 10px 0 #ff5d73}
.term .ok{color:#6bf0a0}.term .bd{color:#ff5d73;font-weight:700}
.term .cur{display:inline-block;width:.6em;height:1.1em;background:#cfd0ff;vertical-align:-.2em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.errmsg{margin-top:26px;max-width:52ch}
.errmsg h2{font:800 clamp(1.5rem,5vw,2.2rem)/1.1 var(--disp);margin:0 0 8px}
.errmsg p{margin:0 0 20px;opacity:.88}
.errmsg .btn{width:auto}
@media(prefers-reduced-motion:reduce){.glt,.glt::before,.glt::after,.term .cur{animation:none}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
@media(prefers-reduced-motion:reduce){.big span,.badge{animation:none}.btn{transition:none}}
</style>
</head>

async function sha(s){const h=await crypto.subtle.digest('SHA-256',enc.encode(s));return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,24)}
async function unlock(name,pw){
  const n=norm(name),e=D.r[await sha(D.s+n)];
  if(!e)return null;
  try{
    const km=await crypto.subtle.importKey('raw',enc.encode(n+'\0'+pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.s),iterations:D.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.v)},key,b64(e.d));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(_){return null}
}

    <p class="kls">${esc(r.j)} · Kelas ${esc(r.k)}</p>
  </div>
  <div class="mq" aria-hidden="true"><div>${'SELAMAT ✦ LOLOS SELEKSI OSIS ✦ SMAN 5 CILEGON ✦ '.repeat(8)}</div></div>
  <div class="sheet">
    <h2>Nilai seleksi</h2>
    <div class="sc"><div class="h">Seleksi</div><div class="h o">Nilai asli</div><div class="h adj">Nilai penyesuaian</div>${rows}</div>
    <p class="note">Tanda – berarti tidak mengikuti seleksi tes yang sudah diselenggarakan.</p>
  </div>
  <div class="wa">
    <h2>Satu langkah lagi: masuk grup WhatsApp</h2>
    <p>Gabung ke grup WhatsApp untuk mendapat informasi lanjutan dari panitia.</p>
    <a class="btn" href="${WA}" target="_blank" rel="noopener">Gabung grup WhatsApp</a>
  </div>`;
  $('login').style.display='none';$('res').style.display='block';scrollTo(0,0);
  $('out').onclick=reset;
  startFX();countUp();
}
async function submit(){
  const n=$('nm').value,p=$('pw').value,b=$('go');
  if(!n.trim()||!p){$('err').textContent='Isi nama lengkap dan password dulu.';return}
  b.disabled=true;b.textContent='Memeriksa…';$('err').textContent='';
  const r=await unlock(n,p);
  b.disabled=false;b.textContent='Lihat hasil';
  if(!r){$('err').textContent='Nama atau password tidak cocok. Periksa ejaan nama dan huruf besar/kecil password.';return}
  show(r);
}
$('go').onclick=submit;
['nm','pw'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')submit()}));
$('eye').onclick=()=>{const t=$('pw').type==='password';$('pw').type=t?'text':'password';$('eye').textContent=t?'Sembunyikan':'Lihat'};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cols=['#ffd23f','#ffb8d1','#f6f3ff','#35e0ff','#1fa855','#ff5d73'];
const FX={on:false,ps:[],raf:0,tm:0};
function spawn(x,y,vx,vy,o={}){FX.ps.push({x,y,vx,vy,s:o.s||5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:o.c||cols[Math.random()*cols.length|0],t:o.t??(Math.random()*4|0),l:0,max:o.max||220,g:o.g??.28,w:Math.random()*6})}
function burst(x,y,n,a0,sp){for(let i=0;i<n;i++){const a=a0+(Math.random()-.5)*sp*2,v=8+Math.random()*13;spawn(x,y,Math.cos(a)*v,Math.sin(a)*v)}kick()}
function kick(){if(!FX.raf)FX.raf=requestAnimationFrame(loop)}
function loop(){
  const c=$('cv'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
  FX.ps=FX.ps.filter(p=>p.l<p.max&&p.y<c.height+30);
  for(const p of FX.ps){
    p.l++;p.vy+=p.g;p.vx*=.986;if(p.g>.1)p.vy*=.986;p.x+=p.vx+Math.sin(p.l/12+p.w)*.6;p.y+=p.vy;p.r+=p.vr;
    x.save();x.globalAlpha=Math.min(1,(p.max-p.l)/40);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
    if(p.t==1){x.beginPath();x.arc(0,0,p.s/2.2,0,7);x.fill()}
    else if(p.t==2){const s=p.s*1.3;x.beginPath();x.moveTo(0,-s);x.quadraticCurveTo(0,0,s,0);x.quadraticCurveTo(0,0,0,s);x.quadraticCurveTo(0,0,-s,0);x.quadraticCurveTo(0,0,0,-s);x.fill()}
    else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    x.restore();
  }
  FX.raf=0;if(FX.on||FX.ps.length)kick();else x.clearRect(0,0,c.width,c.height);
}
function fit(){const c=$('cv');c.width=innerWidth;c.height=innerHeight}
function startFX(){
  if(RM)return;stopFX();FX.on=true;fit();
  const W=innerWidth,H=innerHeight;
  burst(0,H,70,-1,.5);burst(W,H,70,-Math.PI+1,.5);
  setTimeout(()=>FX.on&&burst(W/2,H*.4,70,-Math.PI/2,Math.PI),450);
  setTimeout(()=>FX.on&&(burst(W*.2,H*.5,30,-Math.PI/2,1.2),burst(W*.8,H*.5,30,-Math.PI/2,1.2)),1400);
  FX.tm=setInterval(()=>{if(!document.hidden&&FX.ps.length<110)spawn(Math.random()*innerWidth,-12,(Math.random()-.5),.8+Math.random()*1.4,{g:.012,max:700,s:4+Math.random()*5,t:Math.random()<.4?2:Math.random()*2|0});kick()},130);
}
function stopFX(){FX.on=false;clearInterval(FX.tm);FX.ps=[];const c=$('cv');c.getContext('2d').clearRect(0,0,c.width,c.height)}
addEventListener('resize',()=>FX.on&&fit());
addEventListener('pointermove',e=>{if(FX.on&&Math.random()<.3){spawn(e.clientX,e.clientY,(Math.random()-.5)*2,(Math.random()-.5)*2,{g:.02,max:45,s:3+Math.random()*4,t:2,c:Math.random()<.5?'#ffd23f':'#ffb8d1'});kick()}});
addEventListener('pointerdown',e=>{if(FX.on&&!e.target.closest('a,button,input'))burst(e.clientX,e.clientY,36,-Math.PI/2,Math.PI*.8)});
function countUp(){
  if(RM)return;
  document.querySelectorAll('.n[data-v]').forEach((el,i)=>{
    const v=+el.dataset.v,t0=performance.now()+1300+i*70;el.textContent=0;
    (function f(t){const k=Math.min(1,Math.max(0,(t-t0)/1100));el.textContent=Math.round(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0);
  });
}
</script>
</body>
